name: Pipeline CI/CD - EduDev On-line

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/checkout@v3
      with:
        node-version: '18'

    - name: Instalar Dependências
      run: |
        cd app
        npm install

    - name: Construir Imagem Docker
      run: |
        docker build -t edudev-online:${{ github.sha }} .